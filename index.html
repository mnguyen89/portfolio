                font-family: "Geist", system-ui, sans-serif;
                color: #1c1917;
            }

                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 28px;
                width: min(320px, 100%);
            }

            .pf-lock__mark {
                margin: 0;
                font-family: "Bricolage Grotesque", sans-serif;
                font-weight: 800;
                font-size: 33.33px;
                line-height: 1.05;
                letter-spacing: -0.025em;
                text-transform: uppercase;
                text-align: center;
            }

            .pf-lock__form { display: flex; flex-direction: column; gap: 12px; width: 100%; }

            /* three stacked rows: wordmark, field, button */
            .pf-lock__row { display: flex; flex-direction: column; gap: 12px; }

            .pf-lock__input {
                width: 100%;
                padding: 10px 12px;
                text-align: center;
                border: 1px solid rgba(94, 93, 96, 0.13);
                border-radius: 10px;
                background: #ffffff;
                font: inherit;
                font-size: 13.33px;
                color: #1c1917;
            }

            .pf-lock__input::placeholder { color: #6b6661; }
            .pf-lock__input:focus-visible { outline: 2px solid #e76f51; outline-offset: 2px; }

            .pf-lock__btn {
                width: 100%;
                padding: 10px 14px;
                text-align: center;
                border: 0;
                border-radius: 10px;
                background: #1d1c1d;
                color: #ffffff;
                font: inherit;
                font-size: 13.33px;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.15s ease, opacity 0.15s ease;
            }

            .pf-lock__btn:hover { transform: translateY(-1px); opacity: 0.9; }
            .pf-lock__btn:focus-visible { outline: 2px solid #e76f51; outline-offset: 2px; }

            .pf-lock__err {
                margin: 0;
                min-height: 1em;
                font-size: 13.33px;
                color: #e76f51;
                text-align: center;
            }

            /* Remember-me is pre-checked and never shown: the password is asked
               once, so the checkbox would be UI with nothing to decide. The
               script un-hides its label, hence the separate rule here. */
            .staticrypt-remember { display: none !important; }

            .staticrypt-spinner-container { display: grid; place-items: center; }

            .staticrypt-spinner {
                width: 20px;
                height: 20px;
                border: 2px solid rgba(94, 93, 96, 0.18);
                border-top-color: #6b6661;
                border-radius: 50%;
                animation: pf-spin 0.7s linear infinite;
            }

            @keyframes pf-spin { to { transform: rotate(360deg); } }

            @media (prefers-reduced-motion: reduce) {
                .pf-lock__btn { transition: none; }
                .pf-lock__btn:hover { transform: none; }
                .staticrypt-spinner { animation-duration: 2s; }
            }
        </style>
    </head>
