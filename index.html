<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Minh Nguyen</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap"
            rel="stylesheet"
        />

        <style>
            /* Matches the site: same paper gradient, Bricolage wordmark, Geist
               body, and the .pf-cta button treatment. */
            * { box-sizing: border-box; }

            .hidden { display: none !important; }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: linear-gradient(180deg, #fbf9f6 12.694%, #ffffff 121.69%) no-repeat;
                font-family: "Geist", system-ui, sans-serif;
                color: #1c1917;
            }

            .pf-lock {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 28px;
                width: min(320px, 100%);
            }

            .pf-lock__mark {
                margin: 0;
                font-family: "Bricolage Grotesque", sans-serif;
                font-weight: 800;
                font-size: 33.33px;
                line-height: 1.05;
                letter-spacing: -0.025em;
                text-transform: uppercase;
                text-align: center;
            }

            .pf-lock__form { display: flex; flex-direction: column; gap: 12px; width: 100%; }

            /* three stacked rows: wordmark, field, button */
            .pf-lock__row { display: flex; flex-direction: column; gap: 20px; }

            .pf-lock__field { position: relative; display: flex; }

            .pf-lock__input {
                width: 100%;
                /* padded both sides by the toggle's width so centred text sits
                   on the true centre rather than being pushed left by it */
                padding: 10px 38px;
                text-align: center;
                border: 1px solid rgba(94, 93, 96, 0.13);
                border-radius: 10px;
                background: #ffffff;
                font: inherit;
                font-size: 13.33px;
                color: #1c1917;
            }

            .pf-lock__input::placeholder { color: #6b6661; }
            .pf-lock__input:focus-visible { outline: 2px solid #e76f51; outline-offset: 2px; }

            .pf-lock__toggle {
                position: absolute;
                top: 50%;
                right: 8px;
                transform: translateY(-50%);
                display: grid;
                place-items: center;
                width: 28px;
                height: 28px;
                padding: 0;
                border: 0;
                border-radius: 8px;
                background: transparent;
                cursor: pointer;
            }

            .pf-lock__toggle img { display: block; width: 15px; height: 15px; opacity: 0.5; }
            .pf-lock__toggle:hover img { opacity: 0.85; }
            .pf-lock__toggle:focus-visible { outline: 2px solid #e76f51; outline-offset: 1px; }

            .pf-lock__btn {
                width: 100%;
                padding: 10px 14px;
                text-align: center;
                border: 0;
                border-radius: 10px;
                background: #1d1c1d;
                color: #ffffff;
                font: inherit;
                font-size: 13.33px;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.15s ease, opacity 0.15s ease;
            }

            .pf-lock__btn:hover { transform: translateY(-1px); opacity: 0.9; }
            .pf-lock__btn:focus-visible { outline: 2px solid #e76f51; outline-offset: 2px; }

            .pf-lock__err {
                margin: 0;
                min-height: 1em;
                font-size: 13.33px;
                color: #e76f51;
                text-align: center;
            }

            /* Remember-me is pre-checked and never shown: the password is asked
               once, so the checkbox would be UI with nothing to decide. The
               script un-hides its label, hence the separate rule here. */
            .staticrypt-remember { display: none !important; }

            .staticrypt-spinner-container { display: grid; place-items: center; }

            .staticrypt-spinner {
                width: 20px;
                height: 20px;
                border: 2px solid rgba(94, 93, 96, 0.18);
                border-top-color: #6b6661;
                border-radius: 50%;
                animation: pf-spin 0.7s linear infinite;
            }

            @keyframes pf-spin { to { transform: rotate(360deg); } }

            @media (prefers-reduced-motion: reduce) {
                .pf-lock__btn { transition: none; }
                .pf-lock__btn:hover { transform: none; }
                .staticrypt-spinner { animation-duration: 2s; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <main class="pf-lock">

                            </button>
                        </div>
                        <button type="submit" class="pf-lock__btn">Enter</button>

                    <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" checked />
                        Remember me
                    </label>
                </form>
            </main>
        </div>
